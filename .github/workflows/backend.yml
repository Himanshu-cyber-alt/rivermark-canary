
name: Deploy Backend - Canary

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # ECR LOGIN
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # BUILD IMAGE
      # ============================================================

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            ./backend


      # ============================================================
      # PUSH IMAGE
      # ============================================================

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"


      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Deploy backend
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |

          echo "============================================"
          echo "Starting Rivermark Canary Deployment"
          echo "============================================"

          cat > /tmp/deploy.sh <<'REMOTE_SCRIPT'
          #!/bin/bash

          set -e

          IMAGE_URI="__IMAGE_URI__"
          AWS_REGION="__AWS_REGION__"

          STABLE_PORT="5000"
          CANARY_PORT="5001"

          STABLE_CONTAINER="rivermark-stable"
          CANARY_CONTAINER="rivermark-canary"

          echo "============================================"
          echo "Rivermark Canary Deployment"
          echo "============================================"
          echo "New image: $IMAGE_URI"
          echo "Stable port: $STABLE_PORT"
          echo "Canary port: $CANARY_PORT"
          echo "============================================"


          # ==========================================================
          # ECR LOGIN
          # ==========================================================

          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)

          echo "Logging into ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin "$REGISTRY"


          # ==========================================================
          # PULL NEW IMAGE
          # ==========================================================

          echo "Pulling new image..."

          docker pull "$IMAGE_URI"


          # ==========================================================
          # FIRST DEPLOYMENT
          # ==========================================================

          if [ ! -f /opt/rivermark/stable-version ]; then

              echo "============================================"
              echo "FIRST DEPLOYMENT"
              echo "============================================"

              docker rm -f "$STABLE_CONTAINER" 2>/dev/null || true
              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

              echo "Starting stable..."

              docker run -d \
                --name "$STABLE_CONTAINER" \
                -p "$STABLE_PORT:5000" \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"

              sleep 5

              echo "Checking stable health..."

              curl --fail --silent \
                "http://127.0.0.1:$STABLE_PORT/health"

              echo "Stable health check PASSED"

              echo "$STABLE_PORT" > /opt/rivermark/stable-port
              echo "$IMAGE_URI" > /opt/rivermark/stable-version

              echo "$CANARY_PORT" > /opt/rivermark/canary-port
              echo "$IMAGE_URI" > /opt/rivermark/canary-version

              cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              nginx -t
              systemctl reload nginx

              echo "FIRST DEPLOYMENT COMPLETE"

              exit 0
          fi


          # ==========================================================
          # EXISTING DEPLOYMENT
          # ==========================================================

          CURRENT_STABLE_IMAGE=$(cat /opt/rivermark/stable-version)

          echo "============================================"
          echo "EXISTING DEPLOYMENT"
          echo "============================================"
          echo "Current stable:"
          echo "$CURRENT_STABLE_IMAGE"
          echo "New version:"
          echo "$IMAGE_URI"
          echo "============================================"


          # ==========================================================
          # DEPLOY NEW VERSION ONLY TO CANARY
          # ==========================================================

          echo "Deploying new version to CANARY..."

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$IMAGE_URI" \
            "$IMAGE_URI"

          sleep 5


          # ==========================================================
          # INITIAL CANARY HEALTH CHECK
          # ==========================================================

          echo "Checking initial canary health..."

          if ! curl --fail --silent \
            "http://127.0.0.1:$CANARY_PORT/health"; then

              echo "============================================"
              echo "CANARY FAILED INITIAL HEALTH CHECK"
              echo "ROLLING BACK"
              echo "============================================"

              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p "$CANARY_PORT:5000" \
                -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
                "$CURRENT_STABLE_IMAGE"

              sleep 5

              curl --fail --silent \
                "http://127.0.0.1:$CANARY_PORT/health"

              echo "$CANARY_PORT" > /opt/rivermark/canary-port
              echo "$CURRENT_STABLE_IMAGE" > /opt/rivermark/canary-version

              echo "Canary restored to previous stable version"

              exit 1
          fi

          echo "Canary health check PASSED"


          # ==========================================================
          # NGINX CONFIGURATION FUNCTION
          # ==========================================================

          configure_nginx() {

              STABLE_WEIGHT="$1"
              CANARY_WEIGHT="$2"

              echo "============================================"
              echo "Traffic configuration"
              echo "Stable: $STABLE_WEIGHT%"
              echo "Canary: $CANARY_WEIGHT%"
              echo "============================================"

              # ------------------------------------------------------
              # 100% STABLE
              # ------------------------------------------------------

              if [ "$CANARY_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              # ------------------------------------------------------
              # 100% CANARY
              # ------------------------------------------------------

              elif [ "$STABLE_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$CANARY_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              # ------------------------------------------------------
              # WEIGHTED TRAFFIC
              # ------------------------------------------------------

              else

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT weight=$STABLE_WEIGHT;
              server 127.0.0.1:$CANARY_PORT weight=$CANARY_WEIGHT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              fi

              nginx -t
              systemctl reload nginx
          }


          # ==========================================================
          # CANARY HEALTH CHECK
          # ==========================================================

          check_canary() {

              echo "Checking canary health..."

              curl --fail --silent \
                "http://127.0.0.1:$CANARY_PORT/health"
          }


          # ==========================================================
          # ROLLBACK
          # ==========================================================

          rollback() {

              echo "============================================"
              echo "AUTOMATIC ROLLBACK"
              echo "============================================"

              # Immediately send all traffic to stable
              configure_nginx 100 0

              # Remove bad canary
              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

              # Restore previous known-good version
              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p "$CANARY_PORT:5000" \
                -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
                "$CURRENT_STABLE_IMAGE"

              sleep 5

              curl --fail --silent \
                "http://127.0.0.1:$CANARY_PORT/health"

              echo "$CANARY_PORT" > /opt/rivermark/canary-port
              echo "$CURRENT_STABLE_IMAGE" > /opt/rivermark/canary-version

              echo "============================================"
              echo "ROLLBACK COMPLETE"
              echo "Stable: $CURRENT_STABLE_IMAGE"
              echo "Canary restored: $CURRENT_STABLE_IMAGE"
              echo "============================================"
          }


          # ==========================================================
          # STAGE 1 — 90/10
          # ==========================================================

          echo "============================================"
          echo "STAGE 1: 90% STABLE / 10% CANARY"
          echo "============================================"

          configure_nginx 90 10

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 2 — 75/25
          # ==========================================================

          echo "============================================"
          echo "STAGE 2: 75% STABLE / 25% CANARY"
          echo "============================================"

          configure_nginx 75 25

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 3 — 50/50
          # ==========================================================

          echo "============================================"
          echo "STAGE 3: 50% STABLE / 50% CANARY"
          echo "============================================"

          configure_nginx 50 50

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 4 — 100% CANARY
          # ==========================================================

          echo "============================================"
          echo "STAGE 4: 100% CANARY"
          echo "============================================"

          configure_nginx 0 100

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # PROMOTION
          #
          # At this point:
          #
          # stable container = OLD version on 5000
          # canary container = NEW version on 5001
          #
          # Traffic = 100% canary
          #
          # We first create the NEW stable container on 5000.
          # The old stable must temporarily be stopped.
          #
          # Because traffic is still 100% on canary (5001),
          # stopping the old stable does NOT interrupt user traffic.
          # ==========================================================

          echo "============================================"
          echo "CANARY PASSED"
          echo "PROMOTING NEW VERSION"
          echo "============================================"


          # ==========================================================
          # STOP OLD STABLE
          # ==========================================================

          echo "Stopping old stable..."

          docker rm -f "$STABLE_CONTAINER" 2>/dev/null || true


          # ==========================================================
          # START NEW VERSION AS STABLE
          # ==========================================================

          echo "Starting new version as stable on port 5000..."

          docker run -d \
            --name "$STABLE_CONTAINER" \
            -p "$STABLE_PORT:5000" \
            -e APP_VERSION="$IMAGE_URI" \
            "$IMAGE_URI"

          sleep 5

          echo "Checking new stable health..."

          curl --fail --silent \
            "http://127.0.0.1:$STABLE_PORT/health"

          echo "New stable health PASSED"


          # ==========================================================
          # NOW SEND TRAFFIC TO NEW STABLE
          # ==========================================================

          configure_nginx 100 0


          # ==========================================================
          # RESTORE OLD VERSION INTO CANARY SLOT
          # ==========================================================

          echo "Restoring old stable version into canary slot..."

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
            "$CURRENT_STABLE_IMAGE"

          sleep 5

          echo "Checking restored canary..."

          curl --fail --silent \
            "http://127.0.0.1:$CANARY_PORT/health"


          # ==========================================================
          # SAVE STATE
          # ==========================================================

          echo "$STABLE_PORT" > /opt/rivermark/stable-port
          echo "$IMAGE_URI" > /opt/rivermark/stable-version

          echo "$CANARY_PORT" > /opt/rivermark/canary-port
          echo "$CURRENT_STABLE_IMAGE" > /opt/rivermark/canary-version


          # ==========================================================
          # FINAL STATE
          # ==========================================================

          echo "============================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "============================================"

          echo "Stable:"
          echo "  Container: $STABLE_CONTAINER"
          echo "  Port: $STABLE_PORT"
          echo "  Version: $IMAGE_URI"

          echo ""

          echo "Canary:"
          echo "  Container: $CANARY_CONTAINER"
          echo "  Port: $CANARY_PORT"
          echo "  Version: $CURRENT_STABLE_IMAGE"

          echo ""

          echo "Traffic:"
          echo "  100% → stable"

          echo ""

          echo "Both containers are running."
          echo "============================================"

          REMOTE_SCRIPT


          # ==========================================================
          # REPLACE PLACEHOLDERS
          # ==========================================================

          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" /tmp/deploy.sh
          sed -i "s|__AWS_REGION__|$AWS_REGION|g" /tmp/deploy.sh


          # ==========================================================
          # BASE64
          # ==========================================================

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy.sh)


          # ==========================================================
          # SEND THROUGH SSM
          # ==========================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SCRIPT_B64' | base64 -d > /tmp/rivermark-deploy.sh && chmod +x /tmp/rivermark-deploy.sh && /tmp/rivermark-deploy.sh\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"


          # ==========================================================
          # WAIT FOR DEPLOYMENT
          # ==========================================================

          for i in {1..120}; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text)

              echo "Deployment status: $STATUS"


              if [ "$STATUS" = "Success" ]; then

                  echo "============================================"
                  echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
                  echo "============================================"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query "StandardOutputContent" \
                    --output text

                  exit 0
              fi


              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

                  echo "============================================"
                  echo "DEPLOYMENT FAILED"
                  echo "============================================"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json

                  exit 1
              fi


              sleep 5

          done


          echo "Deployment timed out"
          exit 1

