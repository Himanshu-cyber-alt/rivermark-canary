name: Rivermark Backend - Canary Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:
    inputs:

      failure_mode:
        description: "Choose deployment test mode"
        required: true
        type: choice
        default: normal
        options:
          - normal
          - startup-failure
          - degradation

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # ECR LOGIN
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # BUILD IMAGE
      # ============================================================

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            ./backend


      # ============================================================
      # PUSH IMAGE
      # ============================================================

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"


      # ============================================================
      # DEPLOY TO EC2
      # ============================================================

      - name: Canary Deployment
        env:

          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}

          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          FAILURE_MODE: ${{ inputs.failure_mode || 'normal' }}

        run: |

          echo "============================================"
          echo "RIVERMARK CANARY DEPLOYMENT"
          echo "============================================"

          echo "Image:"
          echo "$IMAGE_URI"

          echo "Failure mode:"
          echo "$FAILURE_MODE"

          echo "============================================"


          # ========================================================
          # CREATE REMOTE DEPLOYMENT SCRIPT
          # ========================================================

          cat > /tmp/rivermark-deploy.sh <<'REMOTE_SCRIPT'

          #!/bin/bash

          set -e


          # ========================================================
          # VARIABLES
          # ========================================================

          IMAGE_URI="__IMAGE_URI__"
          AWS_REGION="__AWS_REGION__"
          FAILURE_MODE="__FAILURE_MODE__"

          STABLE_CONTAINER="rivermark-stable"
          CANARY_CONTAINER="rivermark-canary"

          STABLE_PORT="5000"
          CANARY_PORT="5001"


          echo "============================================"
          echo "RIVERMARK CANARY DEPLOYMENT"
          echo "============================================"

          echo "New image:"
          echo "$IMAGE_URI"

          echo "Failure mode:"
          echo "$FAILURE_MODE"

          echo "============================================"


          # ========================================================
          # ECR LOGIN
          # ========================================================

          echo "Logging into ECR..."

          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)

          aws ecr get-login-password \
            --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin "$REGISTRY"


          # ========================================================
          # PULL NEW IMAGE
          # ========================================================

          echo "Pulling new image..."

          docker pull "$IMAGE_URI"


          # ========================================================
          # CHECK CURRENT STABLE
          # ========================================================

          echo "Checking stable container..."

          if ! docker ps \
              --format '{{.Names}}' | \
              grep -q "^${STABLE_CONTAINER}$"; then

              echo "ERROR: Stable container is not running."

              exit 1

          fi

          echo "Stable container is running."


          # ========================================================
          # SAVE CURRENT STABLE IMAGE
          # ========================================================

          CURRENT_STABLE_IMAGE=$(docker inspect \
            -f '{{.Config.Image}}' \
            "$STABLE_CONTAINER")

          echo "Current stable image:"
          echo "$CURRENT_STABLE_IMAGE"


          # ========================================================
          # SAVE STATE
          # ========================================================

          mkdir -p /opt/rivermark

          echo "$CURRENT_STABLE_IMAGE" \
            > /opt/rivermark/stable-version


          # ========================================================
          # DELETE ONLY CANARY
          # ========================================================

          echo "============================================"
          echo "Removing ONLY canary container"
          echo "============================================"

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true


          # ========================================================
          # CANARY FAILURE MODE
          # ========================================================

          CANARY_FAIL_HEALTH="false"
          CANARY_DEGRADE_AFTER="0"


          if [ "$FAILURE_MODE" = "startup-failure" ]; then

              echo "TEST MODE: startup failure"

              CANARY_FAIL_HEALTH="true"

          fi


          if [ "$FAILURE_MODE" = "degradation" ]; then

              echo "TEST MODE: gradual degradation"

              # The canary starts healthy.
              # After enough application requests,
              # /health will start returning HTTP 500.

              CANARY_DEGRADE_AFTER="12"

          fi


          # ========================================================
          # START NEW IMAGE AS CANARY
          # ========================================================

          echo "============================================"
          echo "Starting NEW image as CANARY"
          echo "============================================"

          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$IMAGE_URI" \
            -e FAIL_HEALTH="$CANARY_FAIL_HEALTH" \
            -e DEGRADE_AFTER="$CANARY_DEGRADE_AFTER" \
            "$IMAGE_URI"


          # ========================================================
          # WAIT
          # ========================================================

          sleep 5


          # ========================================================
          # INITIAL CANARY HEALTH CHECK
          # ========================================================

          echo "============================================"
          echo "INITIAL CANARY HEALTH CHECK"
          echo "============================================"


          if ! curl \
              --fail \
              --silent \
              "http://127.0.0.1:$CANARY_PORT/health"; then

              echo "============================================"
              echo "CANARY FAILED INITIAL HEALTH CHECK"
              echo "============================================"

              echo "Stable remains untouched."

              echo "Removing failed canary..."

              docker rm -f "$CANARY_CONTAINER" \
                2>/dev/null || true


              echo "Restoring previous stable image into canary..."

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p "$CANARY_PORT:5000" \
                -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
                "$CURRENT_STABLE_IMAGE"


              sleep 5


              curl \
                --fail \
                --silent \
                "http://127.0.0.1:$CANARY_PORT/health"


              echo "$CURRENT_STABLE_IMAGE" \
                > /opt/rivermark/canary-version


              echo "============================================"
              echo "ROLLBACK COMPLETE"
              echo "============================================"

              exit 1

          fi


          echo ""
          echo "CANARY INITIAL HEALTH CHECK PASSED"


          # ========================================================
          # NGINX FUNCTION
          # ========================================================

          configure_nginx() {

              STABLE_WEIGHT="$1"
              CANARY_WEIGHT="$2"


              echo "============================================"
              echo "CONFIGURING TRAFFIC"
              echo "Stable : $STABLE_WEIGHT%"
              echo "Canary : $CANARY_WEIGHT%"
              echo "============================================"


              # ----------------------------------------------------
              # 100% STABLE
              # ----------------------------------------------------

              if [ "$CANARY_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX

          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }

          NGINX


              # ----------------------------------------------------
              # 100% CANARY
              # ----------------------------------------------------

              elif [ "$STABLE_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX

          upstream rivermark_backend {
              server 127.0.0.1:$CANARY_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }

          NGINX


              # ----------------------------------------------------
              # WEIGHTED TRAFFIC
              # ----------------------------------------------------

              else

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX

          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT weight=$STABLE_WEIGHT;
              server 127.0.0.1:$CANARY_PORT weight=$CANARY_WEIGHT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }

          NGINX

              fi


              nginx -t

              systemctl reload nginx
          }


          # ========================================================
          # CANARY MONITORING
          # ========================================================

          check_canary() {

              echo "Checking canary..."


              # Generate a few application requests.

              # This is important for the degradation test because
              # the application's DEGRADE_AFTER counter is based
              # on requests to "/".

              for i in {1..5}; do

                  curl \
                    --silent \
                    --show-error \
                    "http://127.0.0.1:$CANARY_PORT/" \
                    > /dev/null || true

              done


              # Now check health.

              if ! curl \
                  --fail \
                  --silent \
                  "http://127.0.0.1:$CANARY_PORT/health"; then

                  return 1

              fi

              return 0
          }


          # ========================================================
          # ROLLBACK
          # ========================================================

          rollback() {

              echo "============================================"
              echo "AUTOMATIC ROLLBACK"
              echo "============================================"


              # Immediately remove canary traffic.

              configure_nginx 100 0


              echo "Removing bad canary..."

              docker rm -f "$CANARY_CONTAINER" \
                2>/dev/null || true


              echo "Restoring previous stable version..."

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p "$CANARY_PORT:5000" \
                -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
                "$CURRENT_STABLE_IMAGE"


              sleep 5


              curl \
                --fail \
                --silent \
                "http://127.0.0.1:$CANARY_PORT/health"


              echo "$CURRENT_STABLE_IMAGE" \
                > /opt/rivermark/canary-version


              echo "============================================"
              echo "ROLLBACK COMPLETE"
              echo "============================================"

              echo "Stable:"
              echo "$CURRENT_STABLE_IMAGE"

              echo "Canary restored:"
              echo "$CURRENT_STABLE_IMAGE"

              echo "Traffic:"
              echo "100% stable"

              echo "============================================"
          }


          # ========================================================
          # STAGE 1
          # ========================================================

          echo "============================================"
          echo "STAGE 1"
          echo "90% STABLE / 10% CANARY"
          echo "============================================"


          configure_nginx 90 10


          # Give you time to demonstrate real traffic.

          sleep 20


          if ! check_canary; then

              rollback

              exit 1

          fi


          # ========================================================
          # STAGE 2
          # ========================================================

          echo "============================================"
          echo "STAGE 2"
          echo "75% STABLE / 25% CANARY"
          echo "============================================"


          configure_nginx 75 25


          sleep 20


          if ! check_canary; then

              rollback

              exit 1

          fi


          # ========================================================
          # STAGE 3
          # ========================================================

          echo "============================================"
          echo "STAGE 3"
          echo "50% STABLE / 50% CANARY"
          echo "============================================"


          configure_nginx 50 50


          sleep 20


          if ! check_canary; then

              rollback

              exit 1

          fi


          # ========================================================
          # STAGE 4
          # ========================================================

          echo "============================================"
          echo "STAGE 4"
          echo "100% CANARY"
          echo "============================================"


          configure_nginx 0 100


          sleep 20


          if ! check_canary; then

              rollback

              exit 1

          fi


          # ========================================================
          # CANARY PASSED
          # ========================================================

          echo "============================================"
          echo "CANARY PASSED ALL STAGES"
          echo "============================================"


          # ========================================================
          # PROMOTION
          # ========================================================
          #
          # At this moment:
          #
          # OLD stable → :5000
          # NEW canary → :5001
          #
          # Traffic → 100% canary
          #
          # Therefore we can safely replace the stable container.
          #
          # ========================================================


          echo "Stopping old stable..."

          docker rm -f "$STABLE_CONTAINER"


          echo "Starting NEW version as stable..."

          docker run -d \
            --name "$STABLE_CONTAINER" \
            -p "$STABLE_PORT:5000" \
            -e APP_VERSION="$IMAGE_URI" \
            "$IMAGE_URI"


          sleep 5


          echo "Checking new stable health..."

          curl \
            --fail \
            --silent \
            "http://127.0.0.1:$STABLE_PORT/health"


          echo ""

          echo "New stable health PASSED"


          # ========================================================
          # SEND TRAFFIC TO NEW STABLE
          # ========================================================

          configure_nginx 100 0


          # ========================================================
          # RESTORE OLD VERSION INTO CANARY SLOT
          # ========================================================

          echo "Restoring old stable into canary slot..."

          docker rm -f "$CANARY_CONTAINER" \
            2>/dev/null || true


          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
            "$CURRENT_STABLE_IMAGE"


          sleep 5


          curl \
            --fail \
            --silent \
            "http://127.0.0.1:$CANARY_PORT/health"


          echo ""


          # ========================================================
          # SAVE STATE
          # ========================================================

          echo "$IMAGE_URI" \
            > /opt/rivermark/stable-version


          echo "$CURRENT_STABLE_IMAGE" \
            > /opt/rivermark/canary-version


          echo "$STABLE_PORT" \
            > /opt/rivermark/stable-port


          echo "$CANARY_PORT" \
            > /opt/rivermark/canary-port


          # ========================================================
          # FINAL STATUS
          # ========================================================

          echo "============================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "============================================"

          echo ""
          echo "Stable:"
          echo "  Container: $STABLE_CONTAINER"
          echo "  Port: $STABLE_PORT"
          echo "  Version: $IMAGE_URI"

          echo ""

          echo "Canary:"
          echo "  Container: $CANARY_CONTAINER"
          echo "  Port: $CANARY_PORT"
          echo "  Version: $CURRENT_STABLE_IMAGE"

          echo ""

          echo "Traffic:"
          echo "  100% → new stable"

          echo ""

          echo "Both containers are running."

          echo "============================================"


          REMOTE_SCRIPT


          # ============================================================
          # REPLACE VARIABLES
          # ============================================================

          sed -i \
            "s|__IMAGE_URI__|$IMAGE_URI|g" \
            /tmp/rivermark-deploy.sh

          sed -i \
            "s|__AWS_REGION__|$AWS_REGION|g" \
            /tmp/rivermark-deploy.sh

          sed -i \
            "s|__FAILURE_MODE__|$FAILURE_MODE|g" \
            /tmp/rivermark-deploy.sh


          # ============================================================
          # BASE64
          # ============================================================

          SCRIPT_B64=$(base64 -w 0 /tmp/rivermark-deploy.sh)


          # ============================================================
          # SEND TO EC2 USING SSM
          # ============================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SCRIPT_B64' | base64 -d > /tmp/rivermark-deploy.sh && chmod +x /tmp/rivermark-deploy.sh && /tmp/rivermark-deploy.sh\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID:"
          echo "$COMMAND_ID"


          # ============================================================
          # WAIT FOR DEPLOYMENT
          # ============================================================

          for i in {1..120}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)


            echo "Deployment status: $STATUS"


            if [ "$STATUS" = "Success" ]; then

              echo "============================================"
              echo "DEPLOYMENT COMPLETED"
              echo "============================================"


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" \
                --output text


              exit 0

            fi


            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "============================================"
              echo "DEPLOYMENT FAILED"
              echo "============================================"


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json


              exit 1

            fi


            sleep 5

          done


          echo "Deployment timed out."

          exit 1