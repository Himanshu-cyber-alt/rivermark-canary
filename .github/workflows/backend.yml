
name: Deploy Backend - Canary

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # ECR Login
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # Build Docker Image
      # ============================================================

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./backend


      # ============================================================
      # Push Docker Image
      # ============================================================

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # ============================================================
      # Canary Deployment
      # ============================================================

      - name: Deploy canary
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        run: |

          # ==========================================================
          # Function: Execute command through SSM
          # ==========================================================

          run_ssm() {

            local COMMAND="$1"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[\"$COMMAND\"]" \
              --region "$AWS_REGION" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command: $COMMAND_ID"

            for i in {1..60}; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text)

              echo "SSM status: $STATUS"

              if [ "$STATUS" = "Success" ]; then
                return 0
              fi

              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

                echo "SSM command failed"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION"

                return 1
              fi

              sleep 5

            done

            echo "SSM command timed out"
            return 1
          }


          # ==========================================================
          # Determine current stable port
          # ==========================================================

          echo "Checking current stable port..."

          STABLE_PORT=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["if [ -f /opt/rivermark/stable-port ]; then cat /opt/rivermark/stable-port; else echo 5000; fi"]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Stable-port command: $STABLE_PORT"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$STABLE_PORT" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              echo "Could not determine stable port"
              exit 1
            fi

            sleep 2
          done

          STABLE_PORT=$(aws ssm get-command-invocation \
            --command-id "$STABLE_PORT" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text | tr -d '[:space:]')

          echo "Current stable port: $STABLE_PORT"


          # ==========================================================
          # Select opposite port for canary
          # ==========================================================

          if [ "$STABLE_PORT" = "5000" ]; then
            CANARY_PORT="5001"
          else
            CANARY_PORT="5000"
          fi

          echo "Stable port: $STABLE_PORT"
          echo "Canary port: $CANARY_PORT"


          # ==========================================================
          # Start new canary
          # ==========================================================

          echo "Starting new canary..."

          START_COMMAND=$(cat <<EOF
set -e

echo "Logging into ECR..."

REGISTRY="\$(echo '$IMAGE_URI' | cut -d/ -f1)"

aws ecr get-login-password --region $AWS_REGION | \
docker login --username AWS --password-stdin "\$REGISTRY"

echo "Pulling image..."

docker pull '$IMAGE_URI'

echo "Removing old container on canary port..."

docker rm -f rivermark-canary 2>/dev/null || true

echo "Starting canary container..."

docker run -d \
  --name rivermark-canary \
  -p $CANARY_PORT:5000 \
  -e APP_VERSION='${{ github.sha }}' \
  '$IMAGE_URI'

sleep 5

echo "Checking canary container..."

docker ps --filter name=rivermark-canary

echo "Checking canary health..."

curl --fail --silent http://127.0.0.1:$CANARY_PORT/health

echo "Canary is healthy"
EOF
)

          run_ssm "$START_COMMAND"


          # ==========================================================
          # Function: Update Nginx
          # ==========================================================

          update_nginx() {

            STABLE_WEIGHT="$1"
            CANARY_WEIGHT="$2"

            echo "============================================"
            echo "Traffic update"
            echo "Stable: $STABLE_WEIGHT%"
            echo "Canary: $CANARY_WEIGHT%"
            echo "============================================"

            NGINX_COMMAND=$(cat <<EOF
set -e

sed -i "s/server 127.0.0.1:$STABLE_PORT weight=[0-9]*;/server 127.0.0.1:$STABLE_PORT weight=$STABLE_WEIGHT;/" /etc/nginx/conf.d/rivermark.conf

sed -i "s/server 127.0.0.1:$CANARY_PORT weight=[0-9]*;/server 127.0.0.1:$CANARY_PORT weight=$CANARY_WEIGHT;/" /etc/nginx/conf.d/rivermark.conf

nginx -t

systemctl reload nginx

echo "Nginx traffic updated"
EOF
)

            run_ssm "$NGINX_COMMAND"
          }


          # ==========================================================
          # Function: Canary Health Check
          # ==========================================================

          check_canary() {

            echo "Checking canary..."

            HEALTH_COMMAND="curl --fail --silent http://127.0.0.1:$CANARY_PORT/health"

            if run_ssm "$HEALTH_COMMAND"; then
              echo "Canary health check PASSED"
              return 0
            else
              echo "Canary health check FAILED"
              return 1
            fi
          }


          # ==========================================================
          # Function: Rollback
          # ==========================================================

          rollback() {

            echo "============================================"
            echo "CANARY FAILED"
            echo "STARTING AUTOMATIC ROLLBACK"
            echo "============================================"

            ROLLBACK_COMMAND=$(cat <<EOF
set -e

sed -i "s/server 127.0.0.1:$STABLE_PORT weight=[0-9]*;/server 127.0.0.1:$STABLE_PORT weight=100;/" /etc/nginx/conf.d/rivermark.conf

sed -i "s/server 127.0.0.1:$CANARY_PORT weight=[0-9]*;/server 127.0.0.1:$CANARY_PORT weight=0;/" /etc/nginx/conf.d/rivermark.conf

nginx -t

systemctl reload nginx

docker rm -f rivermark-canary 2>/dev/null || true

echo "Rollback completed"
EOF
)

            run_ssm "$ROLLBACK_COMMAND"
          }


          # ==========================================================
          # Stage 1
          # 90% Stable / 10% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 1: 90/10"
          echo "============================================"

          update_nginx 90 10

          if ! check_canary; then
            rollback
            exit 1
          fi

          sleep 10


          # ==========================================================
          # Stage 2
          # 75% Stable / 25% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 2: 75/25"
          echo "============================================"

          update_nginx 75 25

          sleep 10

          if ! check_canary; then
            rollback
            exit 1
          fi


          # ==========================================================
          # Stage 3
          # 50% Stable / 50% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 3: 50/50"
          echo "============================================"

          update_nginx 50 50

          sleep 10

          if ! check_canary; then
            rollback
            exit 1
          fi


          # ==========================================================
          # Stage 4
          # 0% Stable / 100% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 4: 100% CANARY"
          echo "============================================"

          update_nginx 0 100

          sleep 10

          if ! check_canary; then
            rollback
            exit 1
          fi


          # ==========================================================
          # Promote Canary
          # ==========================================================

          echo "============================================"
          echo "PROMOTING CANARY"
          echo "============================================"

          PROMOTE_COMMAND=$(cat <<EOF
set -e

docker rm -f rivermark-stable 2>/dev/null || true

docker rename rivermark-canary rivermark-stable

echo '$CANARY_PORT' > /opt/rivermark/stable-port

echo '${{ github.sha }}' > /opt/rivermark/stable-version

cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
upstream rivermark_backend {
    server 127.0.0.1:$CANARY_PORT weight=100;
    server 127.0.0.1:$STABLE_PORT weight=0;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://rivermark_backend;

        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }
}
NGINX

nginx -t

systemctl reload nginx

echo "Canary promoted successfully"
EOF
)

          run_ssm "$PROMOTE_COMMAND"

          echo "============================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "============================================"