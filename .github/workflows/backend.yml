```yaml
name: Deploy Backend - Canary

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # ECR Login
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # Build Docker image
      # ============================================================

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            ./backend


      # ============================================================
      # Push Docker image
      # ============================================================

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"


      # ============================================================
      # Deploy
      # ============================================================

      - name: Deploy backend
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |

          echo "============================================"
          echo "Starting Rivermark deployment"
          echo "============================================"


          # ==========================================================
          # Create remote deployment script
          # ==========================================================

          cat > /tmp/deploy.sh <<'REMOTE_SCRIPT'
          #!/bin/bash

          set -e

          IMAGE_URI="__IMAGE_URI__"
          AWS_REGION="__AWS_REGION__"

          echo "Image: $IMAGE_URI"


          # ==========================================================
          # ECR Login
          # ==========================================================

          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)

          echo "Logging into ECR..."

          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"


          # ==========================================================
          # Pull image
          # ==========================================================

          echo "Pulling image..."

          docker pull "$IMAGE_URI"


          # ==========================================================
          # FIRST DEPLOYMENT
          # ==========================================================

          if [ ! -f /opt/rivermark/stable-port ]; then

              echo "============================================"
              echo "FIRST DEPLOYMENT"
              echo "============================================"

              docker rm -f rivermark-stable 2>/dev/null || true
              docker rm -f rivermark-canary 2>/dev/null || true

              echo "Starting stable container on port 5000..."

              docker run -d \
                --name rivermark-stable \
                -p 5000:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"

              sleep 5

              echo "Checking application..."

              curl --fail --silent \
                http://127.0.0.1:5000/health

              echo "5000" > /opt/rivermark/stable-port
              echo "$IMAGE_URI" > /opt/rivermark/stable-version


              # ------------------------------------------------------
              # First deployment Nginx
              # ------------------------------------------------------

              cat > /etc/nginx/conf.d/rivermark.conf <<'NGINX'
          upstream rivermark_backend {
              server 127.0.0.1:5000;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX

              nginx -t
              systemctl reload nginx

              echo "============================================"
              echo "FIRST DEPLOYMENT COMPLETE"
              echo "Stable port: 5000"
              echo "============================================"

              exit 0
          fi


          # ==========================================================
          # EXISTING DEPLOYMENT
          # ==========================================================

          STABLE_PORT=$(cat /opt/rivermark/stable-port)

          echo "Current stable port: $STABLE_PORT"


          if [ "$STABLE_PORT" = "5000" ]; then
              CANARY_PORT="5001"
          else
              CANARY_PORT="5000"
          fi

          echo "New canary port: $CANARY_PORT"


          # ==========================================================
          # Remove previous canary
          # ==========================================================

          docker rm -f rivermark-canary 2>/dev/null || true


          # ==========================================================
          # Start new canary
          # ==========================================================

          echo "============================================"
          echo "STARTING CANARY"
          echo "============================================"

          docker run -d \
            --name rivermark-canary \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$IMAGE_URI" \
            "$IMAGE_URI"

          sleep 5


          # ==========================================================
          # Initial health check
          # ==========================================================

          echo "Checking initial canary health..."

          if ! curl --fail --silent \
            "http://127.0.0.1:$CANARY_PORT/health"; then

              echo "Canary health check FAILED"

              docker rm -f rivermark-canary 2>/dev/null || true

              exit 1
          fi

          echo "Canary health check PASSED"


          # ==========================================================
          # Function: configure Nginx
          # ==========================================================

          configure_nginx() {

              STABLE_WEIGHT="$1"
              CANARY_WEIGHT="$2"

              echo "Stable: $STABLE_WEIGHT%"
              echo "Canary: $CANARY_WEIGHT%"


              # ------------------------------------------------------
              # 100% Stable
              # ------------------------------------------------------

              if [ "$CANARY_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX


              # ------------------------------------------------------
              # 100% Canary
              # ------------------------------------------------------

              elif [ "$STABLE_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$CANARY_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX


              # ------------------------------------------------------
              # Weighted rollout
              # ------------------------------------------------------

              else

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT weight=$STABLE_WEIGHT;
              server 127.0.0.1:$CANARY_PORT weight=$CANARY_WEIGHT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              fi


              nginx -t
              systemctl reload nginx
          }


          # ==========================================================
          # Function: health check
          # ==========================================================

          check_canary() {

              echo "Checking canary health..."

              curl --fail --silent \
                "http://127.0.0.1:$CANARY_PORT/health"
          }


          # ==========================================================
          # Function: rollback
          # ==========================================================

          rollback() {

              echo "============================================"
              echo "CANARY FAILED"
              echo "AUTOMATIC ROLLBACK"
              echo "============================================"

              configure_nginx 100 0

              docker rm -f rivermark-canary 2>/dev/null || true

              echo "Rollback complete"
          }


          # ==========================================================
          # STAGE 1
          # 90 / 10
          # ==========================================================

          echo "============================================"
          echo "STAGE 1: 90% STABLE / 10% CANARY"
          echo "============================================"

          configure_nginx 90 10

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 2
          # 75 / 25
          # ==========================================================

          echo "============================================"
          echo "STAGE 2: 75% STABLE / 25% CANARY"
          echo "============================================"

          configure_nginx 75 25

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 3
          # 50 / 50
          # ==========================================================

          echo "============================================"
          echo "STAGE 3: 50% STABLE / 50% CANARY"
          echo "============================================"

          configure_nginx 50 50

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 4
          # 100% CANARY
          # ==========================================================

          echo "============================================"
          echo "STAGE 4: 100% CANARY"
          echo "============================================"

          configure_nginx 0 100

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # PROMOTE CANARY
          # ==========================================================

          echo "============================================"
          echo "PROMOTING CANARY"
          echo "============================================"

          docker rm -f rivermark-stable 2>/dev/null || true

          docker rename \
            rivermark-canary \
            rivermark-stable

          echo "$CANARY_PORT" > /opt/rivermark/stable-port
          echo "$IMAGE_URI" > /opt/rivermark/stable-version


          # ==========================================================
          # Final Nginx configuration
          # ==========================================================

          cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$CANARY_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

          nginx -t
          systemctl reload nginx

          echo "============================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "New stable port: $CANARY_PORT"
          echo "============================================"

          REMOTE_SCRIPT


          # ==========================================================
          # Replace placeholders
          # ==========================================================

          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" /tmp/deploy.sh
          sed -i "s|__AWS_REGION__|$AWS_REGION|g" /tmp/deploy.sh


          # ==========================================================
          # Base64 encode deployment script
          # ==========================================================

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy.sh)


          # ==========================================================
          # Send script through SSM
          # ==========================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SCRIPT_B64' | base64 -d > /tmp/rivermark-deploy.sh && chmod +x /tmp/rivermark-deploy.sh && /tmp/rivermark-deploy.sh\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"


          # ==========================================================
          # Wait for deployment
          # ==========================================================

          for i in {1..120}; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text)

              echo "Deployment status: $STATUS"


              if [ "$STATUS" = "Success" ]; then

                  echo "============================================"
                  echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
                  echo "============================================"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query "StandardOutputContent" \
                    --output text

                  exit 0
              fi


              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

                  echo "============================================"
                  echo "DEPLOYMENT FAILED"
                  echo "============================================"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json

                  exit 1
              fi


              sleep 5

          done


          echo "Deployment timed out"
          exit 1
```
