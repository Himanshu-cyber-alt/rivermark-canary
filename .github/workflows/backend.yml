
name: Backend Canary Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "nginx/**"
      - "scripts/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend
  EC2_INSTANCE_ID: i-06eccf377b423aa0b

jobs:
  deploy-backend:
    name: Build, Push and Canary Deploy
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Configure AWS using GitHub OIDC
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # Login to Amazon ECR
      # ======================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================================
      # Build Docker image
      # ======================================================

      - name: Build backend Docker image
        working-directory: backend
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .


      # ======================================================
      # Push Docker image to ECR
      # ======================================================

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # ======================================================
      # Deploy Canary through AWS Systems Manager
      # ======================================================

      - name: Start Canary Deployment
        id: deploy
        run: |

          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          echo "Deploying image:"
          echo "$IMAGE"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="sudo /opt/rivermark/deploy-canary.sh '$IMAGE'" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Canary deployment completed successfully."