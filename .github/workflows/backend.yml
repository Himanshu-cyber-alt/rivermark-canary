name: Backend Canary Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "nginx/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

  STABLE_CONTAINER: rivermark-stable
  CANARY_CONTAINER: rivermark-canary

  STABLE_PORT: 5000
  CANARY_PORT: 5001

  # ------------------------------------------------------------
  # Change these values to demonstrate different traffic splits.
  #
  # Examples:
  # 90 / 10
  # 80 / 20
  # 70 / 30
  # 60 / 40
  # 50 / 50
  # 40 / 60
  # 30 / 70
  # 20 / 80
  # 10 / 90
  #
  # Stable + Canary must always equal 100.
  # Neither value can be 0.
  # ------------------------------------------------------------
  STABLE_WEIGHT: 50
  CANARY_WEIGHT: 50

jobs:

  deploy:
    name: Backend Canary Deployment
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configure AWS using GitHub OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 3. Login to Amazon ECR
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # 4. Build and push Docker image
      # ============================================================

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "Building backend image..."

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./backend


          echo "Pushing backend image..."

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Deploy to EC2 using SSM
      # ============================================================

      - name: Deploy backend to EC2
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          IMAGE_URI: ${{ env.IMAGE_URI }}

          STABLE_WEIGHT: ${{ env.STABLE_WEIGHT }}
          CANARY_WEIGHT: ${{ env.CANARY_WEIGHT }}

        run: |

          cat > /tmp/rivermark-deploy.sh <<'REMOTE_SCRIPT'

          #!/bin/bash

          set -e


          # ==========================================================
          # Variables
          # ==========================================================

          IMAGE_URI="$1"

          STABLE_WEIGHT="$2"
          CANARY_WEIGHT="$3"

          STABLE_CONTAINER="rivermark-stable"
          CANARY_CONTAINER="rivermark-canary"

          STABLE_PORT=5000
          CANARY_PORT=5001


          # ==========================================================
          # Show deployment information
          # ==========================================================

          echo "=========================================="
          echo "RIVERMARK BACKEND DEPLOYMENT"
          echo "=========================================="

          echo ""
          echo "New image:"
          echo "$IMAGE_URI"

          echo ""
          echo "Requested traffic:"
          echo "Stable : ${STABLE_WEIGHT}%"
          echo "Canary : ${CANARY_WEIGHT}%"


          # ==========================================================
          # Validate weights
          # ==========================================================

          if [ "$STABLE_WEIGHT" -le 0 ] || [ "$CANARY_WEIGHT" -le 0 ]; then

              echo "ERROR: Neither weight can be zero."

              exit 1

          fi


          TOTAL=$((STABLE_WEIGHT + CANARY_WEIGHT))

          if [ "$TOTAL" -ne 100 ]; then

              echo "ERROR: Stable + Canary must equal 100."

              exit 1

          fi


          # ==========================================================
          # Configure Nginx
          # ==========================================================

          configure_nginx() {

              STABLE_WEIGHT="$1"
              CANARY_WEIGHT="$2"

              echo ""
              echo "=========================================="
              echo "UPDATING NGINX"
              echo "=========================================="

              echo "Stable : ${STABLE_WEIGHT}%"
              echo "Canary : ${CANARY_WEIGHT}%"


              if [ "$STABLE_WEIGHT" -le 0 ] || [ "$CANARY_WEIGHT" -le 0 ]; then

                  echo "ERROR: Weight cannot be zero."

                  exit 1

              fi


              TOTAL=$((STABLE_WEIGHT + CANARY_WEIGHT))

              if [ "$TOTAL" -ne 100 ]; then

                  echo "ERROR: Weights must add up to 100."

                  exit 1

              fi


              cat > /etc/nginx/conf.d/rivermark.conf <<EOF

          upstream rivermark_backend {

              server 127.0.0.1:${STABLE_PORT} weight=${STABLE_WEIGHT};

              server 127.0.0.1:${CANARY_PORT} weight=${CANARY_WEIGHT};

          }


          server {

              listen 80;

              server_name _;


              location / {

                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;

                  proxy_set_header X-Real-IP \$remote_addr;

                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;

                  proxy_set_header X-Forwarded-Proto \$scheme;

              }

          }

          EOF


              nginx -t

              systemctl reload nginx


              echo ""

              echo "Nginx updated successfully."

          }


          # ==========================================================
          # Check if stable container exists
          # ==========================================================

          if docker ps -a \
              --format '{{.Names}}' |
              grep -qx "$STABLE_CONTAINER"
          then

              STABLE_EXISTS=true

          else

              STABLE_EXISTS=false

          fi


          # ==========================================================
          # FIRST DEPLOYMENT
          # ==========================================================

          if [ "$STABLE_EXISTS" = false ]; then

              echo ""
              echo "=========================================="
              echo "FIRST DEPLOYMENT"
              echo "=========================================="


              # ------------------------------------------------------
              # Login to ECR
              # ------------------------------------------------------

              aws ecr get-login-password \
                --region ap-south-1 |
                docker login \
                  --username AWS \
                  --password-stdin \
                  "$(echo "$IMAGE_URI" | cut -d/ -f1)"


              # ------------------------------------------------------
              # Pull image
              # ------------------------------------------------------

              echo ""
              echo "Pulling image..."

              docker pull "$IMAGE_URI"


              # ------------------------------------------------------
              # Create stable
              # ------------------------------------------------------

              echo ""
              echo "Creating stable container..."

              docker run -d \
                --name "$STABLE_CONTAINER" \
                -p ${STABLE_PORT}:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"


              # ------------------------------------------------------
              # Create canary
              # ------------------------------------------------------

              echo ""
              echo "Creating canary container..."

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p ${CANARY_PORT}:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"


              # ------------------------------------------------------
              # Wait for containers
              # ------------------------------------------------------

              sleep 5


              # ------------------------------------------------------
              # Check stable
              # ------------------------------------------------------

              echo ""
              echo "Checking stable..."

              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                http://127.0.0.1:${STABLE_PORT}/health

              echo ""


              # ------------------------------------------------------
              # Check canary
              # ------------------------------------------------------

              echo ""
              echo "Checking canary..."

              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                http://127.0.0.1:${CANARY_PORT}/health

              echo ""


              # ------------------------------------------------------
              # Configure initial traffic
              # ------------------------------------------------------

              configure_nginx \
                "$STABLE_WEIGHT" \
                "$CANARY_WEIGHT"


              echo ""
              echo "=========================================="
              echo "FIRST DEPLOYMENT COMPLETE"
              echo "=========================================="

              echo ""
              echo "Stable image:"
              echo "$IMAGE_URI"

              echo ""
              echo "Canary image:"
              echo "$IMAGE_URI"

              exit 0

          fi


          # ==========================================================
          # EXISTING DEPLOYMENT
          #
          # IMPORTANT:
          #
          # Stable is NEVER recreated here.
          #
          # Only the canary container is replaced.
          # ==========================================================

          echo ""
          echo "=========================================="
          echo "NEW BACKEND DEPLOYMENT"
          echo "=========================================="


          # ==========================================================
          # Show current stable image
          # ==========================================================

          OLD_STABLE_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            "$STABLE_CONTAINER")


          echo ""
          echo "Current stable image:"
          echo "$OLD_STABLE_IMAGE"


          # ==========================================================
          # Login to ECR
          # ==========================================================

          aws ecr get-login-password \
            --region ap-south-1 |
            docker login \
              --username AWS \
              --password-stdin \
              "$(echo "$IMAGE_URI" | cut -d/ -f1)"


          # ==========================================================
          # Pull NEW image
          # ==========================================================

          echo ""
          echo "Pulling new image..."

          docker pull "$IMAGE_URI"


          # ==========================================================
          # REMOVE ONLY CANARY
          #
          # Stable remains untouched.
          # ==========================================================

          echo ""
          echo "Removing old canary..."

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true


          # ==========================================================
          # CREATE NEW CANARY
          # ==========================================================

          echo ""
          echo "Creating new canary..."

          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p ${CANARY_PORT}:5000 \
            -e APP_VERSION="$IMAGE_URI" \
            "$IMAGE_URI"


          # ==========================================================
          # Wait for canary
          # ==========================================================

          sleep 5


          # ==========================================================
          # Check canary
          # ==========================================================

          echo ""
          echo "Checking new canary..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 5 \
            http://127.0.0.1:${CANARY_PORT}/health

          echo ""


          # ==========================================================
          # Configure requested traffic split
          # ==========================================================

          configure_nginx \
            "$STABLE_WEIGHT" \
            "$CANARY_WEIGHT"


          # ==========================================================
          # Deployment information
          # ==========================================================

          echo ""
          echo "=========================================="
          echo "CANARY DEPLOYMENT READY"
          echo "=========================================="


          echo ""
          echo "Stable:"
          echo "$OLD_STABLE_IMAGE"

          echo ""
          echo "Canary:"
          echo "$IMAGE_URI"

          echo ""
          echo "Traffic:"
          echo "${STABLE_WEIGHT}% → STABLE"

          echo "${CANARY_WEIGHT}% → CANARY"


          echo ""
          echo "Containers:"

          docker ps \
            --filter "name=$STABLE_CONTAINER" \
            --filter "name=$CANARY_CONTAINER"


          echo ""
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="


          REMOTE_SCRIPT


          # ============================================================
          # Encode deployment script
          # ============================================================

          SCRIPT_B64=$(base64 -w 0 /tmp/rivermark-deploy.sh)


          # ============================================================
          # Send script to EC2 through SSM
          # ============================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"echo $SCRIPT_B64 | base64 -d > /tmp/rivermark-deploy.sh\",
              \"chmod +x /tmp/rivermark-deploy.sh\",
              \"/tmp/rivermark-deploy.sh '$IMAGE_URI' '$STABLE_WEIGHT' '$CANARY_WEIGHT'\"
            ]" \
            --query "Command.CommandId" \
            --output text)


          echo ""
          echo "SSM Command ID:"
          echo "$COMMAND_ID"


          # ============================================================
          # Wait for deployment
          # ============================================================

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)


            echo "Deployment status: $STATUS"


            if [ "$STATUS" = "Success" ]; then

              echo ""
              echo "=========================================="
              echo "DEPLOYMENT COMPLETED"
              echo "=========================================="


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text


              exit 0


            elif [ "$STATUS" = "Failed" ] ||
                 [ "$STATUS" = "Cancelled" ] ||
                 [ "$STATUS" = "TimedOut" ]; then

              echo ""
              echo "=========================================="
              echo "DEPLOYMENT FAILED"
              echo "=========================================="


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text


              exit 1

            fi


            sleep 5

          done


          echo "Deployment timed out."

          exit 1