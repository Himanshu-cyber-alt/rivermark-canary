
name: Deploy Backend - Canary

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Configure AWS using GitHub OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # Login to ECR
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # Build Docker image
      # ============================================================

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend


      # ============================================================
      # Push Docker image
      # ============================================================

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


      # ============================================================
      # Deploy Canary
      # ============================================================

      - name: Deploy canary
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |

          # ==========================================================
          # Function: Run command through SSM
          # ==========================================================

          run_ssm() {

            COMMAND="$1"

            PARAMETERS=$(jq -n \
              --arg command "$COMMAND" \
              '{commands: [$command]}')

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "$PARAMETERS" \
              --region "$AWS_REGION" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            for i in {1..60}; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text)

              echo "SSM Status: $STATUS"

              if [ "$STATUS" = "Success" ]; then

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text

                return 0
              fi

              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

                echo "SSM command failed"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json

                return 1
              fi

              sleep 5

            done

            echo "SSM command timed out"
            return 1
          }


          # ==========================================================
          # Determine current stable port
          # ==========================================================

          echo "Checking current stable port..."

          GET_PORT_COMMAND=$(cat <<'SCRIPT'
          if [ -f /opt/rivermark/stable-port ]; then
              cat /opt/rivermark/stable-port
          else
              echo 5000
          fi
          SCRIPT
          )

          STABLE_PORT=$(run_ssm "$GET_PORT_COMMAND" | tail -1 | tr -d '[:space:]')

          echo "Stable port: $STABLE_PORT"


          # ==========================================================
          # Select opposite port for new canary
          # ==========================================================

          if [ "$STABLE_PORT" = "5000" ]; then
            CANARY_PORT="5001"
          else
            CANARY_PORT="5000"
          fi

          echo "Canary port: $CANARY_PORT"


          # ==========================================================
          # Start new canary container
          # ==========================================================

          START_CANARY_COMMAND=$(cat <<SCRIPT
          set -e

          echo "Logging into ECR..."

          REGISTRY="\$(echo '$IMAGE_URI' | cut -d/ -f1)"

          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin "\$REGISTRY"

          echo "Pulling image..."

          docker pull "$IMAGE_URI"

          echo "Removing previous canary container..."

          docker rm -f rivermark-canary 2>/dev/null || true

          echo "Starting new canary..."

          docker run -d \
            --name rivermark-canary \
            -p $CANARY_PORT:5000 \
            -e APP_VERSION="${{ github.sha }}" \
            "$IMAGE_URI"

          echo "Waiting for application..."

          sleep 5

          echo "Canary container:"

          docker ps --filter "name=rivermark-canary"

          echo "Checking canary health..."

          curl --fail --silent http://127.0.0.1:$CANARY_PORT/health

          echo "Canary is healthy"
          SCRIPT
          )

          if ! run_ssm "$START_CANARY_COMMAND"; then
            echo "Canary failed during startup"
            exit 1
          fi


          # ==========================================================
          # Function: Update Nginx traffic
          # ==========================================================

          update_nginx() {

            STABLE_WEIGHT="$1"
            CANARY_WEIGHT="$2"

            echo "============================================"
            echo "Updating traffic"
            echo "Stable: $STABLE_WEIGHT%"
            echo "Canary: $CANARY_WEIGHT%"
            echo "============================================"

            NGINX_COMMAND=$(cat <<SCRIPT
            set -e

            sed -i "s/server 127.0.0.1:$STABLE_PORT weight=[0-9]*;/server 127.0.0.1:$STABLE_PORT weight=$STABLE_WEIGHT;/" /etc/nginx/conf.d/rivermark.conf

            sed -i "s/server 127.0.0.1:$CANARY_PORT weight=[0-9]*;/server 127.0.0.1:$CANARY_PORT weight=$CANARY_WEIGHT;/" /etc/nginx/conf.d/rivermark.conf

            nginx -t

            systemctl reload nginx

            echo "Nginx reload successful"
            SCRIPT
            )

            run_ssm "$NGINX_COMMAND"
          }


          # ==========================================================
          # Function: Check canary
          # ==========================================================

          check_canary() {

            echo "Checking canary health..."

            HEALTH_COMMAND="
            set -e

            curl --fail --silent http://127.0.0.1:$CANARY_PORT/health

            echo 'Canary health check passed'
            "

            run_ssm "$HEALTH_COMMAND"
          }


          # ==========================================================
          # Function: Rollback
          # ==========================================================

          rollback() {

            echo "============================================"
            echo "CANARY FAILED"
            echo "AUTOMATIC ROLLBACK"
            echo "============================================"

            ROLLBACK_COMMAND=$(cat <<SCRIPT
            set -e

            echo "Restoring 100% traffic to stable..."

            sed -i "s/server 127.0.0.1:$STABLE_PORT weight=[0-9]*;/server 127.0.0.1:$STABLE_PORT weight=100;/" /etc/nginx/conf.d/rivermark.conf

            sed -i "s/server 127.0.0.1:$CANARY_PORT weight=[0-9]*;/server 127.0.0.1:$CANARY_PORT weight=0;/" /etc/nginx/conf.d/rivermark.conf

            nginx -t

            systemctl reload nginx

            echo "Removing failed canary..."

            docker rm -f rivermark-canary 2>/dev/null || true

            echo "Rollback completed"
            SCRIPT
            )

            run_ssm "$ROLLBACK_COMMAND"
          }


          # ==========================================================
          # STAGE 1
          # 90% Stable / 10% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 1: 90/10"
          echo "============================================"

          if ! update_nginx 90 10; then
            rollback
            exit 1
          fi

          if ! check_canary; then
            rollback
            exit 1
          fi

          sleep 10


          # ==========================================================
          # STAGE 2
          # 75% Stable / 25% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 2: 75/25"
          echo "============================================"

          if ! update_nginx 75 25; then
            rollback
            exit 1
          fi

          sleep 10

          if ! check_canary; then
            rollback
            exit 1
          fi


          # ==========================================================
          # STAGE 3
          # 50% Stable / 50% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 3: 50/50"
          echo "============================================"

          if ! update_nginx 50 50; then
            rollback
            exit 1
          fi

          sleep 10

          if ! check_canary; then
            rollback
            exit 1
          fi


          # ==========================================================
          # STAGE 4
          # 100% Canary
          # ==========================================================

          echo "============================================"
          echo "STAGE 4: 100% CANARY"
          echo "============================================"

          if ! update_nginx 0 100; then
            rollback
            exit 1
          fi

          sleep 10

          if ! check_canary; then
            rollback
            exit 1
          fi


          # ==========================================================
          # Promote Canary
          # ==========================================================

          echo "============================================"
          echo "PROMOTING CANARY"
          echo "============================================"

          PROMOTE_COMMAND=$(cat <<SCRIPT
          set -e

          echo "Removing old stable container..."

          docker rm -f rivermark-stable 2>/dev/null || true

          echo "Renaming canary to stable..."

          docker rename rivermark-canary rivermark-stable

          echo "$CANARY_PORT" > /opt/rivermark/stable-port

          echo "${{ github.sha }}" > /opt/rivermark/stable-version

          echo "Canary promoted successfully"
          SCRIPT
          )

          if ! run_ssm "$PROMOTE_COMMAND"; then
            echo "Promotion failed"
            exit 1
          fi


          # ==========================================================
          # Final Nginx configuration
          # ==========================================================

          FINAL_NGINX_COMMAND=$(cat <<SCRIPT
          set -e

          cat > /etc/nginx/conf.d/rivermark.conf <<'NGINX'
          upstream rivermark_backend {
              server 127.0.0.1:$CANARY_PORT weight=100;
              server 127.0.0.1:$STABLE_PORT weight=0;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

          nginx -t

          systemctl reload nginx

          echo "Final Nginx configuration applied"
          SCRIPT
          )

          if ! run_ssm "$FINAL_NGINX_COMMAND"; then
            echo "Final Nginx configuration failed"
            exit 1
          fi


          echo "============================================"
          echo "CANARY DEPLOYMENT SUCCESSFUL"
          echo "============================================"

