name: Backend Canary Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "nginx/**"
      - ".github/workflows/backend.yml"

  workflow_dispatch:
    inputs:
      failure_mode:
        description: "Failure scenario"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - startup-failure
          - degradation

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

  STABLE_CONTAINER: rivermark-stable
  CANARY_CONTAINER: rivermark-canary

  STABLE_PORT: 5000
  CANARY_PORT: 5001

jobs:

  deploy:
    name: Backend Canary Deployment
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 3. Login to ECR
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # 4. Build and push new image
      # ============================================================

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./backend

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"


      # ============================================================
      # 5. Deploy through SSM
      # ============================================================

      - name: Deploy backend to EC2
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          FAILURE_MODE: ${{ inputs.failure_mode || 'normal' }}

        run: |

          cat > /tmp/rivermark-deploy.sh <<'REMOTE_SCRIPT'
          #!/bin/bash

          set -e

          IMAGE_URI="$1"
          FAILURE_MODE="$2"

          STABLE_CONTAINER="rivermark-stable"
          CANARY_CONTAINER="rivermark-canary"

          STABLE_PORT=5000
          CANARY_PORT=5001


          # ==========================================================
          # Show current state
          # ==========================================================

          echo "=========================================="
          echo "RIVERMARK CANARY DEPLOYMENT"
          echo "=========================================="

          echo "New image:"
          echo "$IMAGE_URI"

          echo ""
          echo "Failure mode:"
          echo "$FAILURE_MODE"

          echo ""
          echo "Current containers:"
          docker ps \
            --filter "name=$STABLE_CONTAINER" \
            --filter "name=$CANARY_CONTAINER"


          # ==========================================================
          # NGINX CONFIGURATION
          #
          # IMPORTANT:
          # BOTH WEIGHTS ARE ALWAYS GREATER THAN ZERO.
          # ==========================================================

          configure_nginx() {

              STABLE_WEIGHT="$1"
              CANARY_WEIGHT="$2"

              echo ""
              echo "------------------------------------------"
              echo "Updating Nginx"
              echo "Stable : ${STABLE_WEIGHT}%"
              echo "Canary : ${CANARY_WEIGHT}%"
              echo "------------------------------------------"

              if [ "$STABLE_WEIGHT" -le 0 ] || [ "$CANARY_WEIGHT" -le 0 ]; then
                  echo "ERROR: weight cannot be zero."
                  exit 1
              fi


              cat > /etc/nginx/conf.d/rivermark.conf <<EOF
          upstream rivermark_backend {
              server 127.0.0.1:${STABLE_PORT} weight=${STABLE_WEIGHT};
              server 127.0.0.1:${CANARY_PORT} weight=${CANARY_WEIGHT};
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOF


              nginx -t

              systemctl reload nginx

              echo "Nginx configuration updated."
          }


          # ==========================================================
          # CANARY HEALTH CHECK
          # ==========================================================

          check_canary() {

              echo ""
              echo "Checking canary health..."

              if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 5 \
                  http://127.0.0.1:${CANARY_PORT}/health
              then

                  echo ""
                  echo "CANARY HEALTH CHECK PASSED"

                  return 0

              else

                  echo ""
                  echo "CANARY HEALTH CHECK FAILED"

                  return 1

              fi
          }


          # ==========================================================
          # ROLLBACK
          # ==========================================================

          rollback() {

              echo ""
              echo "=========================================="
              echo "ROLLBACK STARTED"
              echo "=========================================="

              echo ""
              echo "Returning traffic to stable."

              # IMPORTANT:
              # We still keep BOTH servers in Nginx.
              #
              # 90% stable
              # 10% canary
              #
              # No weight becomes zero.

              configure_nginx 90 10


              echo ""
              echo "Removing failed canary..."

              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true


              echo ""
              echo "Restoring previous stable version as canary..."

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p ${CANARY_PORT}:5000 \
                -e APP_VERSION="$OLD_STABLE_IMAGE" \
                "$OLD_STABLE_IMAGE"


              sleep 5


              echo ""
              echo "Rollback completed."

              echo ""
              echo "Final containers:"

              docker ps \
                --filter "name=$STABLE_CONTAINER" \
                --filter "name=$CANARY_CONTAINER"
          }


          # ==========================================================
          # CHECK IF STABLE EXISTS
          # ==========================================================

          if docker ps -a \
              --format '{{.Names}}' |
              grep -qx "$STABLE_CONTAINER"
          then

              STABLE_EXISTS=true

          else

              STABLE_EXISTS=false

          fi


          # ==========================================================
          # FIRST DEPLOYMENT
          # ==========================================================

          if [ "$STABLE_EXISTS" = false ]; then

              echo ""
              echo "=========================================="
              echo "FIRST DEPLOYMENT"
              echo "=========================================="


              # ------------------------------------------------------
              # Pull image
              # ------------------------------------------------------

              echo ""
              echo "Pulling image..."

              aws ecr get-login-password \
                --region ap-south-1 |
                docker login \
                  --username AWS \
                  --password-stdin \
                  "$(echo "$IMAGE_URI" | cut -d/ -f1)"

              docker pull "$IMAGE_URI"


              # ------------------------------------------------------
              # Remove any old containers
              # ------------------------------------------------------

              docker rm -f "$STABLE_CONTAINER" 2>/dev/null || true
              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true


              # ------------------------------------------------------
              # Create stable
              # ------------------------------------------------------

              echo ""
              echo "Creating stable container..."

              docker run -d \
                --name "$STABLE_CONTAINER" \
                -p ${STABLE_PORT}:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"


              # ------------------------------------------------------
              # Create canary
              # ------------------------------------------------------

              echo ""
              echo "Creating canary container..."

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p ${CANARY_PORT}:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"


              sleep 5


              # ------------------------------------------------------
              # Health checks
              # ------------------------------------------------------

              echo ""
              echo "Checking stable..."

              curl \
                --fail \
                --silent \
                --show-error \
                http://127.0.0.1:${STABLE_PORT}/health

              echo ""


              echo ""
              echo "Checking canary..."

              curl \
                --fail \
                --silent \
                --show-error \
                http://127.0.0.1:${CANARY_PORT}/health

              echo ""


              # ------------------------------------------------------
              # Initial routing
              #
              # BOTH WEIGHTS > 0
              # ------------------------------------------------------

              configure_nginx 90 10


              echo ""
              echo "=========================================="
              echo "FIRST DEPLOYMENT COMPLETE"
              echo "=========================================="


              exit 0

          fi


          # ==========================================================
          # EXISTING DEPLOYMENT
          #
          # Stable stays untouched.
          # Only canary is replaced.
          # ==========================================================

          echo ""
          echo "=========================================="
          echo "NEW BACKEND DEPLOYMENT"
          echo "=========================================="


          # ==========================================================
          # Save current stable image
          # ==========================================================

          OLD_STABLE_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            "$STABLE_CONTAINER")


          echo ""
          echo "Current stable image:"
          echo "$OLD_STABLE_IMAGE"


          # ==========================================================
          # Pull NEW image
          # ==========================================================

          echo ""
          echo "Pulling new image..."

          aws ecr get-login-password \
            --region ap-south-1 |
            docker login \
              --username AWS \
              --password-stdin \
              "$(echo "$IMAGE_URI" | cut -d/ -f1)"

          docker pull "$IMAGE_URI"


          # ==========================================================
          # DELETE ONLY CANARY
          #
          # Stable is NOT touched.
          # ==========================================================

          echo ""
          echo "Removing old canary..."

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true


          # ==========================================================
          # CREATE NEW CANARY
          # ==========================================================

          echo ""
          echo "Creating new canary..."


          if [ "$FAILURE_MODE" = "startup-failure" ]; then

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p ${CANARY_PORT}:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                -e FAIL_HEALTH=true \
                "$IMAGE_URI"


          elif [ "$FAILURE_MODE" = "degradation" ]; then

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p ${CANARY_PORT}:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                -e DEGRADE_AFTER=12 \
                "$IMAGE_URI"


          else

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p ${CANARY_PORT}:5000 \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"

          fi


          sleep 5


          # ==========================================================
          # INITIAL CANARY CHECK
          # ==========================================================

          if ! check_canary; then

              rollback

              exit 1

          fi


          # ==========================================================
          # PROGRESSIVE CANARY RAMP
          #
          # Stable weight steadily DECREASES.
          # Canary weight steadily INCREASES.
          #
          # 90/10 -> 80/20 -> 70/30 -> 60/40 -> 50/50
          #       -> 40/60 -> 30/70 -> 20/80 -> 10/90
          #
          # Never reaches 100/0 or 0/100.
          # ==========================================================

          CANARY_WEIGHTS=(10 20 30 40 50 60 70 80 90)

          for CANARY_W in "${CANARY_WEIGHTS[@]}"; do

              STABLE_W=$((100 - CANARY_W))

              echo ""
              echo "=========================================="
              echo "STAGE: ${STABLE_W}% STABLE / ${CANARY_W}% CANARY"
              echo "=========================================="

              configure_nginx "$STABLE_W" "$CANARY_W"

              sleep 5

              if ! check_canary; then

                  rollback

                  exit 1

              fi

          done


          # ==========================================================
          # PROMOTION
          #
          # Before:
          #
          # 5000 → OLD VERSION
          # 5001 → NEW VERSION
          #
          # After:
          #
          # 5000 → NEW VERSION
          # 5001 → OLD VERSION
          #
          # We keep Nginx at 90/10.
          # ==========================================================

          echo ""
          echo "=========================================="
          echo "PROMOTING CANARY"
          echo "=========================================="


          NEW_IMAGE="$IMAGE_URI"


          echo ""
          echo "New version:"
          echo "$NEW_IMAGE"

          echo ""
          echo "Old stable:"
          echo "$OLD_STABLE_IMAGE"


          # ==========================================================
          # Stop old stable
          # ==========================================================

          echo ""
          echo "Stopping old stable..."

          docker rm -f "$STABLE_CONTAINER"


          # ==========================================================
          # Start NEW version as stable
          # ==========================================================

          echo ""
          echo "Starting new stable on port 5000..."

          docker run -d \
            --name "$STABLE_CONTAINER" \
            -p ${STABLE_PORT}:5000 \
            -e APP_VERSION="$NEW_IMAGE" \
            "$NEW_IMAGE"


          sleep 5


          # ==========================================================
          # Check new stable
          # ==========================================================

          echo ""
          echo "Checking new stable..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 5 \
            http://127.0.0.1:${STABLE_PORT}/health

          echo ""


          # ==========================================================
          # Replace canary with OLD stable version
          # ==========================================================

          echo ""
          echo "Replacing canary with old stable version..."

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true


          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p ${CANARY_PORT}:5000 \
            -e APP_VERSION="$OLD_STABLE_IMAGE" \
            "$OLD_STABLE_IMAGE"


          sleep 5


          # ==========================================================
          # Final routing
          #
          # New stable gets 90%
          # Old version gets 10%
          #
          # BOTH SERVERS REMAIN.
          # NO WEIGHT IS ZERO.
          # ==========================================================

          configure_nginx 90 10


          echo ""
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="


          echo ""
          echo "Final containers:"

          docker ps \
            --filter "name=$STABLE_CONTAINER" \
            --filter "name=$CANARY_CONTAINER"


          echo ""
          echo "Final traffic:"
          echo "90% → NEW STABLE :5000"
          echo "10% → OLD VERSION :5001"


          REMOTE_SCRIPT


          # ==========================================================
          # Send deployment script through SSM
          # ==========================================================

          SCRIPT_B64=$(base64 -w 0 /tmp/rivermark-deploy.sh)


          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"echo $SCRIPT_B64 | base64 -d > /tmp/rivermark-deploy.sh\",
              \"chmod +x /tmp/rivermark-deploy.sh\",
              \"/tmp/rivermark-deploy.sh '$IMAGE_URI' '$FAILURE_MODE'\"
            ]" \
            --query "Command.CommandId" \
            --output text)


          echo ""
          echo "SSM Command ID:"
          echo "$COMMAND_ID"


          # ==========================================================
          # Wait for SSM deployment
          # ==========================================================

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)


            echo "Deployment status: $STATUS"


            if [ "$STATUS" = "Success" ]; then

              echo ""
              echo "=========================================="
              echo "DEPLOYMENT COMPLETED"
              echo "=========================================="


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text


              exit 0


            elif [ "$STATUS" = "Failed" ] ||
                 [ "$STATUS" = "Cancelled" ] ||
                 [ "$STATUS" = "TimedOut" ]; then


              echo ""
              echo "=========================================="
              echo "DEPLOYMENT FAILED"
              echo "=========================================="


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text


              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text


              exit 1

            fi


            sleep 5

          done


          echo "Deployment timed out."

          exit 1