
name: Deploy Backend - Canary

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # ECR Login
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # Build Docker image
      # ============================================================

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            ./backend


      # ============================================================
      # Push Docker image
      # ============================================================

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"


      # ============================================================
      # Deploy
      # ============================================================

      - name: Deploy backend
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |

          echo "============================================"
          echo "Starting Rivermark Canary Deployment"
          echo "============================================"

          # ==========================================================
          # Create temporary remote deployment script
          # ==========================================================

          cat > /tmp/deploy.sh <<'REMOTE_SCRIPT'
          #!/bin/bash

          set -e

          IMAGE_URI="__IMAGE_URI__"
          AWS_REGION="__AWS_REGION__"

          STABLE_PORT="5000"
          CANARY_PORT="5001"

          STABLE_CONTAINER="rivermark-stable"
          CANARY_CONTAINER="rivermark-canary"

          echo "============================================"
          echo "Rivermark Canary Deployment"
          echo "============================================"
          echo "New image:"
          echo "$IMAGE_URI"
          echo "============================================"


          # ==========================================================
          # ECR LOGIN
          # ==========================================================

          echo "Logging into ECR..."

          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)

          aws ecr get-login-password \
            --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin "$REGISTRY"


          # ==========================================================
          # PULL NEW IMAGE
          # ==========================================================

          echo "Pulling new image..."

          docker pull "$IMAGE_URI"


          # ==========================================================
          # FIRST DEPLOYMENT
          # ==========================================================

          if [ ! -f /opt/rivermark/stable-version ]; then

              echo "============================================"
              echo "FIRST DEPLOYMENT"
              echo "============================================"

              # Remove anything left from an incomplete deployment
              docker rm -f "$STABLE_CONTAINER" 2>/dev/null || true
              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

              echo "Starting stable container..."

              docker run -d \
                --name "$STABLE_CONTAINER" \
                -p "$STABLE_PORT:5000" \
                -e APP_VERSION="$IMAGE_URI" \
                "$IMAGE_URI"

              sleep 5

              echo "Checking stable health..."

              curl --fail --silent \
                "http://127.0.0.1:$STABLE_PORT/health"

              echo "Stable health check PASSED"

              # Save current stable state
              echo "$STABLE_PORT" > /opt/rivermark/stable-port
              echo "$IMAGE_URI" > /opt/rivermark/stable-version

              # Save canary slot information
              echo "$CANARY_PORT" > /opt/rivermark/canary-port
              echo "$IMAGE_URI" > /opt/rivermark/canary-version

              # ------------------------------------------------------
              # Nginx → 100% stable
              # ------------------------------------------------------

              cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              nginx -t
              systemctl reload nginx

              echo "============================================"
              echo "FIRST DEPLOYMENT COMPLETE"
              echo "Stable: $STABLE_CONTAINER"
              echo "Port: $STABLE_PORT"
              echo "============================================"

              exit 0
          fi


          # ==========================================================
          # EXISTING DEPLOYMENT
          # ==========================================================

          echo "============================================"
          echo "EXISTING DEPLOYMENT"
          echo "============================================"


          # ==========================================================
          # Read current stable state
          # ==========================================================

          CURRENT_STABLE_IMAGE=$(cat /opt/rivermark/stable-version)

          echo "Current stable image:"
          echo "$CURRENT_STABLE_IMAGE"

          echo "Stable port:"
          echo "$STABLE_PORT"

          echo "Canary port:"
          echo "$CANARY_PORT"


          # ==========================================================
          # IMPORTANT:
          #
          # Stable container remains untouched.
          #
          # We replace ONLY the canary container with the new image.
          # ==========================================================

          echo "============================================"
          echo "DEPLOYING NEW VERSION TO CANARY"
          echo "============================================"

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$IMAGE_URI" \
            "$IMAGE_URI"

          sleep 5


          # ==========================================================
          # Initial canary health check
          # ==========================================================

          echo "Checking initial canary health..."

          if ! curl --fail --silent \
            "http://127.0.0.1:$CANARY_PORT/health"; then

              echo "============================================"
              echo "CANARY INITIAL HEALTH CHECK FAILED"
              echo "============================================"

              echo "Restoring previous stable image to canary..."

              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p "$CANARY_PORT:5000" \
                -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
                "$CURRENT_STABLE_IMAGE"

              sleep 5

              curl --fail --silent \
                "http://127.0.0.1:$CANARY_PORT/health"

              echo "$CANARY_PORT" > /opt/rivermark/canary-port
              echo "$CURRENT_STABLE_IMAGE" > /opt/rivermark/canary-version

              echo "Canary restored to previous stable version"

              exit 1
          fi

          echo "Canary initial health check PASSED"


          # ==========================================================
          # Function: configure Nginx
          # ==========================================================

          configure_nginx() {

              STABLE_WEIGHT="$1"
              CANARY_WEIGHT="$2"

              echo "============================================"
              echo "Updating traffic"
              echo "Stable: $STABLE_WEIGHT%"
              echo "Canary: $CANARY_WEIGHT%"
              echo "============================================"

              # ------------------------------------------------------
              # 100% stable
              # ------------------------------------------------------

              if [ "$CANARY_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              # ------------------------------------------------------
              # 100% canary
              # ------------------------------------------------------

              elif [ "$STABLE_WEIGHT" = "0" ]; then

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$CANARY_PORT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              # ------------------------------------------------------
              # Weighted traffic
              # ------------------------------------------------------

              else

                  cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT weight=$STABLE_WEIGHT;
              server 127.0.0.1:$CANARY_PORT weight=$CANARY_WEIGHT;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX

              fi

              nginx -t
              systemctl reload nginx
          }


          # ==========================================================
          # Function: Canary health check
          # ==========================================================

          check_canary() {

              echo "Checking canary..."

              curl --fail --silent \
                "http://127.0.0.1:$CANARY_PORT/health"
          }


          # ==========================================================
          # Function: AUTOMATIC ROLLBACK
          # ==========================================================

          rollback() {

              echo "============================================"
              echo "CANARY FAILED"
              echo "AUTOMATIC ROLLBACK"
              echo "============================================"

              # ------------------------------------------------------
              # Send 100% traffic back to stable
              # ------------------------------------------------------

              configure_nginx 100 0

              # ------------------------------------------------------
              # Remove bad canary
              # ------------------------------------------------------

              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

              # ------------------------------------------------------
              # Restore previous stable version in canary slot
              # ------------------------------------------------------

              echo "Restoring previous stable image to canary..."

              docker run -d \
                --name "$CANARY_CONTAINER" \
                -p "$CANARY_PORT:5000" \
                -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
                "$CURRENT_STABLE_IMAGE"

              sleep 5

              curl --fail --silent \
                "http://127.0.0.1:$CANARY_PORT/health"

              echo "$CANARY_PORT" > /opt/rivermark/canary-port
              echo "$CURRENT_STABLE_IMAGE" > /opt/rivermark/canary-version

              echo "============================================"
              echo "ROLLBACK COMPLETE"
              echo "Stable remains: $CURRENT_STABLE_IMAGE"
              echo "Canary restored: $CURRENT_STABLE_IMAGE"
              echo "============================================"
          }


          # ==========================================================
          # STAGE 1
          # 90% STABLE / 10% CANARY
          # ==========================================================

          echo "============================================"
          echo "STAGE 1"
          echo "90% STABLE / 10% CANARY"
          echo "============================================"

          configure_nginx 90 10

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 2
          # 75% STABLE / 25% CANARY
          # ==========================================================

          echo "============================================"
          echo "STAGE 2"
          echo "75% STABLE / 25% CANARY"
          echo "============================================"

          configure_nginx 75 25

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 3
          # 50% STABLE / 50% CANARY
          # ==========================================================

          echo "============================================"
          echo "STAGE 3"
          echo "50% STABLE / 50% CANARY"
          echo "============================================"

          configure_nginx 50 50

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # STAGE 4
          # 100% CANARY
          # ==========================================================

          echo "============================================"
          echo "STAGE 4"
          echo "100% CANARY"
          echo "============================================"

          configure_nginx 0 100

          sleep 10

          if ! check_canary; then
              rollback
              exit 1
          fi


          # ==========================================================
          # SUCCESSFUL PROMOTION
          #
          # IMPORTANT:
          # Both containers remain running.
          #
          # We swap their roles by updating the saved state.
          # ==========================================================

          echo "============================================"
          echo "CANARY HEALTHY"
          echo "PROMOTING NEW VERSION"
          echo "============================================"


          # ----------------------------------------------------------
          # New version becomes stable
          # ----------------------------------------------------------

          echo "$IMAGE_URI" > /opt/rivermark/stable-version
          echo "$STABLE_PORT" > /opt/rivermark/stable-port


          # ----------------------------------------------------------
          # Old stable version becomes canary
          # ----------------------------------------------------------

          echo "$CURRENT_STABLE_IMAGE" > /opt/rivermark/canary-version
          echo "$CANARY_PORT" > /opt/rivermark/canary-port


          # ----------------------------------------------------------
          # IMPORTANT:
          #
          # We now physically put the OLD stable image into the
          # canary slot.
          # ----------------------------------------------------------

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$CURRENT_STABLE_IMAGE" \
            "$CURRENT_STABLE_IMAGE"

          sleep 5

          curl --fail --silent \
            "http://127.0.0.1:$CANARY_PORT/health"


          # ----------------------------------------------------------
          # Final traffic = 100% new stable
          # ----------------------------------------------------------

          configure_nginx 100 0


          echo "============================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "============================================"
          echo "Stable container:"
          echo "  $STABLE_CONTAINER"
          echo "  Version: $IMAGE_URI"
          echo "  Port: $STABLE_PORT"
          echo ""
          echo "Canary container:"
          echo "  $CANARY_CONTAINER"
          echo "  Version: $CURRENT_STABLE_IMAGE"
          echo "  Port: $CANARY_PORT"
          echo ""
          echo "Traffic:"
          echo "  100% → new stable"
          echo "============================================"

          REMOTE_SCRIPT


          # ==========================================================
          # Replace placeholders
          # ==========================================================

          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" /tmp/deploy.sh
          sed -i "s|__AWS_REGION__|$AWS_REGION|g" /tmp/deploy.sh


          # ==========================================================
          # Base64 encode script
          # ==========================================================

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy.sh)


          # ==========================================================
          # Send through SSM
          # ==========================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SCRIPT_B64' | base64 -d > /tmp/rivermark-deploy.sh && chmod +x /tmp/rivermark-deploy.sh && /tmp/rivermark-deploy.sh\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"


          # ==========================================================
          # Wait for deployment
          # ==========================================================

          for i in {1..120}; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "Status" \
                --output text)

              echo "Deployment status: $STATUS"


              if [ "$STATUS" = "Success" ]; then

                  echo "============================================"
                  echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
                  echo "============================================"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query "StandardOutputContent" \
                    --output text

                  exit 0
              fi


              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

                  echo "============================================"
                  echo "DEPLOYMENT FAILED"
                  echo "============================================"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json

                  exit 1
              fi


              sleep 5

          done


          echo "Deployment timed out"
          exit 1

