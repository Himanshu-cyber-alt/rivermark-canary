name: Backend - Canary Deployment

on:
  workflow_dispatch:
    inputs:

      canary_percentage:
        description: "Canary traffic percentage"
        required: true
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "40"
          - "50"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: rivermark-backend

jobs:
  deploy-canary:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # AWS OIDC
      # ============================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # ECR LOGIN
      # ============================================================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ============================================================
      # BUILD NEW IMAGE
      # ============================================================

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" \
            ./backend


      # ============================================================
      # PUSH NEW IMAGE
      # ============================================================

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"


      # ============================================================
      # DEPLOY CANARY
      # ============================================================

      - name: Deploy New Version To Canary
        env:
          INSTANCE_ID: ${{ secrets.BACKEND_INSTANCE_ID }}

          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          CANARY_PERCENTAGE: ${{ inputs.canary_percentage }}

        run: |

          echo "============================================"
          echo "Rivermark Canary Deployment"
          echo "============================================"

          echo "New image:"
          echo "$IMAGE_URI"

          echo "Canary traffic:"
          echo "$CANARY_PERCENTAGE%"

          echo "Stable traffic:"
          echo "$((100 - CANARY_PERCENTAGE))%"

          echo "============================================"


          # ========================================================
          # CREATE REMOTE SCRIPT
          # ========================================================

          cat > /tmp/deploy-canary.sh <<'REMOTE_SCRIPT'
          #!/bin/bash

          set -e

          IMAGE_URI="__IMAGE_URI__"
          AWS_REGION="__AWS_REGION__"

          CANARY_PERCENTAGE="__CANARY_PERCENTAGE__"
          STABLE_PERCENTAGE=$((100 - CANARY_PERCENTAGE))

          STABLE_CONTAINER="rivermark-stable"
          CANARY_CONTAINER="rivermark-canary"

          STABLE_PORT="5000"
          CANARY_PORT="5001"


          echo "============================================"
          echo "Starting Canary Deployment"
          echo "============================================"


          # ========================================================
          # CHECK STABLE
          # ========================================================

          echo "Checking stable container..."

          if ! docker ps --format '{{.Names}}' | \
              grep -q "^${STABLE_CONTAINER}$"; then

              echo "ERROR: Stable container is not running."

              exit 1

          fi

          echo "Stable container is running."


          # ========================================================
          # ECR LOGIN
          # ========================================================

          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)

          echo "Logging into ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" | \
            docker login \
              --username AWS \
              --password-stdin "$REGISTRY"


          # ========================================================
          # PULL NEW IMAGE
          # ========================================================

          echo "Pulling new image..."

          docker pull "$IMAGE_URI"


          # ========================================================
          # DELETE ONLY CANARY
          # ========================================================

          echo "============================================"
          echo "Removing ONLY canary container"
          echo "============================================"

          docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true


          # ========================================================
          # CREATE NEW CANARY
          # ========================================================

          echo "============================================"
          echo "Starting new version as CANARY"
          echo "============================================"

          docker run -d \
            --name "$CANARY_CONTAINER" \
            -p "$CANARY_PORT:5000" \
            -e APP_VERSION="$IMAGE_URI" \
            "$IMAGE_URI"


          # ========================================================
          # WAIT
          # ========================================================

          sleep 5


          # ========================================================
          # CANARY HEALTH CHECK
          # ========================================================

          echo "Checking canary health..."

          if ! curl --fail --silent \
              "http://127.0.0.1:$CANARY_PORT/health"; then

              echo "============================================"
              echo "CANARY HEALTH CHECK FAILED"
              echo "============================================"

              echo "Removing failed canary..."

              docker rm -f "$CANARY_CONTAINER" 2>/dev/null || true

              exit 1

          fi

          echo "Canary health check PASSED."


          # ========================================================
          # UPDATE CANARY VERSION
          # ========================================================

          mkdir -p /opt/rivermark

          echo "$IMAGE_URI" \
            > /opt/rivermark/canary-version


          # ========================================================
          # UPDATE NGINX
          # ========================================================

          echo "============================================"
          echo "Updating Nginx"
          echo "============================================"

          echo "Stable : $STABLE_PERCENTAGE%"
          echo "Canary : $CANARY_PERCENTAGE%"

          cat > /etc/nginx/conf.d/rivermark.conf <<NGINX
          upstream rivermark_backend {
              server 127.0.0.1:$STABLE_PORT weight=$STABLE_PERCENTAGE;
              server 127.0.0.1:$CANARY_PORT weight=$CANARY_PERCENTAGE;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://rivermark_backend;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          NGINX


          # ========================================================
          # TEST NGINX
          # ========================================================

          echo "Testing Nginx..."

          nginx -t


          # ========================================================
          # RELOAD NGINX
          # ========================================================

          echo "Reloading Nginx..."

          systemctl reload nginx


          # ========================================================
          # FINAL STATUS
          # ========================================================

          echo ""
          echo "============================================"
          echo "CANARY DEPLOYMENT COMPLETE"
          echo "============================================"

          echo "Stable container:"
          docker ps \
            --filter "name=$STABLE_CONTAINER"

          echo ""

          echo "Canary container:"
          docker ps \
            --filter "name=$CANARY_CONTAINER"

          echo ""

          echo "Nginx configuration:"
          cat /etc/nginx/conf.d/rivermark.conf

          echo "============================================"

          REMOTE_SCRIPT


          # ============================================================
          # REPLACE VARIABLES
          # ============================================================

          sed -i \
            "s|__IMAGE_URI__|$IMAGE_URI|g" \
            /tmp/deploy-canary.sh

          sed -i \
            "s|__AWS_REGION__|$AWS_REGION|g" \
            /tmp/deploy-canary.sh

          sed -i \
            "s|__CANARY_PERCENTAGE__|$CANARY_PERCENTAGE|g" \
            /tmp/deploy-canary.sh


          # ============================================================
          # BASE64
          # ============================================================

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy-canary.sh)


          # ============================================================
          # SEND TO EC2
          # ============================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SCRIPT_B64' | base64 -d > /tmp/deploy-canary.sh && chmod +x /tmp/deploy-canary.sh && /tmp/deploy-canary.sh\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID:"
          echo "$COMMAND_ID"


          # ============================================================
          # WAIT FOR EC2
          # ============================================================

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"


            if [ "$STATUS" = "Success" ]; then

              echo "============================================"
              echo "CANARY DEPLOYMENT SUCCESSFUL"
              echo "============================================"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi


            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "============================================"
              echo "CANARY DEPLOYMENT FAILED"
              echo "============================================"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json

              exit 1

            fi


            sleep 5

          done


          echo "Deployment timed out."

          exit 1